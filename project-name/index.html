<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Repository Template</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      #ui_layer {
        position: fixed;
        inset: 5%;
        pointer-events: none;
      }

      .corner {
        position: absolute;
        color: black;
        font-size: 10pt;
        pointer-events: auto;
      }

      .corner_top_left {
        top: 0;
        left: 0;
      }

      .corner_top_right {
        top: 0;
        right: 0;
      }

      .corner_bottom_left {
        bottom: 0;
        left: 0;
      }

      .corner_bottom_right {
        right: 0;
        bottom: 0;
      }

      .corner a,
      .corner a:visited {
        color: black;
      }

      .corner_body,
      .corner_title {
        color: black;
        font-size: 10pt;
        line-height: 1.4;
      }

      .corner_title {
        font-weight: 700;
      }

      .corner_body {
        font-weight: 400;
      }

      .settings_option {
        appearance: none;
        background: transparent;
        border: 0;
        color: black;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0;
        font: inherit;
      }

      .settings_option:focus-visible {
        outline: 2px solid black;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <!-- Game engine content belongs in content_layer when a game engine exists. -->
    <div id="content_layer"></div>

    <!-- Any UI, HTML, React, or user-interface content belongs in ui_layer. -->
    <div id="ui_layer">
      <div class="corner corner_top_left">
        <div id="project_title" class="corner_body">GitHub Repository Template</div>
      </div>
      <div class="corner corner_top_right">
        <a href="https://github.com/SamuelAsherRivello/github-repository-template" target="_blank" rel="noopener noreferrer" aria-label="View the repository on GitHub">
          <svg aria-hidden="true" viewBox="0 0 16 16" width="20" height="20" fill="black">
            <path d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.64 5.47 7.71.4.08.55-.18.55-.4 0-.2-.01-.86-.01-1.56-2.01.38-2.53-.5-2.69-.96-.09-.24-.48-.96-.82-1.15-.28-.15-.68-.53-.01-.54.63-.01 1.08.59 1.23.83.72 1.23 1.87.88 2.33.67.07-.53.28-.88.51-1.08-1.78-.21-3.64-.91-3.64-4.04 0-.89.31-1.62.82-2.19-.08-.2-.36-1.04.08-2.16 0 0 .67-.22 2.2.84A7.5 7.5 0 0 1 8 3.82c.68 0 1.36.09 2 .28 1.53-1.06 2.2-.84 2.2-.84.44 1.12.16 1.96.08 2.16.51.57.82 1.29.82 2.19 0 3.14-1.87 3.83-3.65 4.04.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .22.15.48.55.4A8.02 8.02 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z" />
          </svg>
        </a>
      </div>
      <div class="corner corner_bottom_left">
        <section id="settings" aria-labelledby="settings_title">
          <div id="settings_title" class="corner_title">Settings</div>
          <button id="fullscreen_toggle" class="corner_body settings_option" type="button" aria-pressed="false">
            <span>Fullscreen</span><span id="fullscreen_checkbox" aria-hidden="true">☐</span>
          </button>
        </section>
      </div>
      <div class="corner corner_bottom_right">
        <span id="version" class="corner_body"></span>
      </div>
    </div>
    <script type="module">
      import versionText from "../version.txt?raw";

      const fullscreenStorageKey = "github-repository-template.fullscreen";
      const fullscreenToggle = document.getElementById("fullscreen_toggle");
      const fullscreenCheckbox = document.getElementById("fullscreen_checkbox");

      const setFullscreenPreference = (enabled) => {
        localStorage.setItem(fullscreenStorageKey, enabled ? "true" : "false");
        fullscreenToggle.setAttribute("aria-pressed", String(enabled));
        fullscreenCheckbox.textContent = enabled ? "☑" : "☐";
      };

      const enterFullscreen = async () => {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      };

      const exitFullscreen = async () => {
        if (document.fullscreenElement && document.exitFullscreen) {
          await document.exitFullscreen();
        }
      };

      const syncFullscreenState = () => {
        setFullscreenPreference(Boolean(document.fullscreenElement));
      };

      const versionNumber = versionText.trim().replace(/^version=/, "").replace(/^v/, "");
      document.getElementById("version").textContent = `v${versionNumber}`;

      setFullscreenPreference(localStorage.getItem(fullscreenStorageKey) === "true");

      fullscreenToggle.addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) {
            await exitFullscreen();
          } else {
            await enterFullscreen();
            if (!document.fullscreenElement) {
              setFullscreenPreference(true);
            }
          }
        } catch {
          setFullscreenPreference(false);
        }
      });

      document.addEventListener("fullscreenchange", syncFullscreenState);
    </script>
  </body>
</html>
