name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Zero Company
        run: npm test
      - name: Build Zero Company
        run: npm run build
      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          current="$(cut -d= -f2 version.txt)"
          test -n "$current"
          expected="Current version: \`v${current}\`"
          grep -F "$expected" README.md
          if git rev-parse --verify --quiet "refs/tags/v$current"; then
            echo "Tag v$current already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "value=$current" >> "$GITHUB_OUTPUT"
      - name: Tag release commit
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "v$VERSION" --generate-notes --title "v$VERSION"
